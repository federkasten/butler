name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
        clojure: ['1.11', '1.12']
    name: Test with Java ${{ matrix.java }} and Clojure ${{ matrix.clojure }}
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-lein-${{ hashFiles('**/project.clj') }}
        restore-keys: |
          ${{ runner.os }}-lein-
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@13.1
      with:
        lein: latest
    
    - name: Install dependencies
      run: lein deps
    
    - name: Run ClojureScript tests
      run: lein doo node test once
    
    - name: Build development version
      run: lein cljsbuild once dev
    
    - name: Build production version
      run: lein cljsbuild once prod

  test-example:
    runs-on: ubuntu-latest
    name: Test example project
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-lein-example-${{ hashFiles('**/project.clj') }}
        restore-keys: |
          ${{ runner.os }}-lein-
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@13.1
      with:
        lein: latest
    
    - name: Build example project
      working-directory: ./example
      run: lein cljsbuild once

  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Get version
      id: get-version
      run: |
        echo "version=$(head -n 1 project.clj | sed -e 's/^(defproject.*"\(.*\)"$/\1/')" >> $GITHUB_OUTPUT

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, test-example, get-version]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@13.1
      with:
        lein: latest
    
    - name: Deploy to Clojars
      if: endsWith(needs.get-version.outputs.version, '-SNAPSHOT')
      env:
        CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
        CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
      run: lein deploy snapshots